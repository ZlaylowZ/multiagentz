# yaml-language-server: $schema=
name: nukez-optimized
# LeadAgent uses Opus for complex orchestration
lead:
  model: claude-opus-4-20250514  # Expensive but smart for routing
  
  routing_prompt_extra: |
    Nukez is cryptographic storage infrastructure for autonomous AI agents,
    enabling agents to autonomously pay for storage using Solana blockchain,
    receive cryptographic receipts, and reason about verifiable memory through
    attestation pipelines.

    **Core Components:**
    - **Nukez Backend** — FastAPI gateway with attestation, receipts, Solana anchoring
    - **PyLocker SDK** — Production Python client library for agent integration
    - **PTK** — INTERNAL SDK test suite
    - **Frontend** — React application with x402 payment protocol integration

    ## Routing Rules

    - "How do I use Nukez?" → sdk (production interface)
    - "How does attestation work?" → backend (implementation details)
    - "Payment integration?" → sdk + backend
    - "Test infrastructure?" → ptk (internal only)
    - SDK vs PTK: default to sdk unless explicitly about test runners
  
  keywords:
    sdk:
      - pylocker
      - sdk
      - client
      - tool definitions
      - agent instructions
      - quickstart
      - integration
    ptk:
      - ptk
      - test runner
      - test suite
      - test infrastructure
    backend:
      - attestation
      - receipt
      - solana
      - switchboard
      - oracle
      - merkle
      - ed25519
      - pricing
      - storage provider
      - mongodb
      - gcs
    frontend:
      - react
      - firebase
      - x402
      - payment protocol
      - ui
      - component
  
  agents:
    # ── SDK Agent ─────────────────────────────────────────────────────
    sdk:
      repo_path: /Users/zhanson/pylocker
      description: >
        Expert on the PyLocker SDK — the PRODUCTION client library for Nukez.
        Covers client methods, auth, payments, file ops, tool definitions,
        agent integration, and usage examples.
      system_prompt: |
        You are an expert on the PyLocker SDK — the official production
        interface for Nukez cryptographic storage.

        Topics you cover:
        - SDK client methods and usage patterns
        - Authentication (signed envelopes, wallet integration)
        - Payment flows and x402 protocol
        - File operations (upload, download, list, delete)
        - Tool definitions for LLM/agent integration
        - Error handling and retry patterns
        - Integration examples (Anthropic, OpenAI, MCP)

        Ground all responses in the actual SDK source code and documentation.
      key_files:
        - pylocker/__init__.py
        - pylocker/client.py
        - pylocker/auth.py
        - pylocker/payment.py
        - pylocker/errors.py
        - pylocker/types.py
        - pylocker/discovery.py
        - README.md
        - docs/
        - examples/

    # ── PTK Agent ─────────────────────────────────────────────────────
    ptk:
      repo_path: /Users/zhanson/ptk
      description: >
        Expert on PTK (PyLocker Test Kit) — INTERNAL test infrastructure.
        Covers test runners, fixtures, validation, report generation.
      system_prompt: |
        You are an expert on PTK (PyLocker Test Kit), the INTERNAL test
        and validation infrastructure for Nukez.

        Your scope is the TEST INFRASTRUCTURE ITSELF — runners, harnesses,
        validation logic, and how tests are structured.

        If a question is about SDK usage, note that it belongs to the SDK agent.
      key_files:
        - ptk/test_runner.py
        - ptk/agent_executor.py
        - ptk/test_sdk_integration.py
        - ptk/test_contract_validation.py
        - README.md

    # ── Backend (sub-coordinator) ─────────────────────────────────────
    backend:
      type: coordinator
      description: >
        Coordinator for Nukez backend — routes to core, docs, and frontend.
      routing_prompt_extra: |
        - **core**: Business logic (attestation, crypto, payments, storage, receipts)
        - **docs**: Documentation, OpenAPI specs, agent briefings
        - **frontend**: React UI, Firebase deployment, x402 integration
      agents:
        core:
          repo_path: /Users/zhanson/Desktop/DataLocker
          description: >
            Core business logic: attestation, cryptography, payments,
            pricing, storage, receipts, wallets, Solana integration.
          system_prompt: |
            You are an expert on Nukez's core business logic.
            
            Topics: attestation pipelines, merkle tree generation,
            Ed25519 signatures, Solana on-chain anchoring, Switchboard
            oracle integration, pricing modules, storage provider
            abstraction, MongoDB integration, receipt generation,
            wallet management, security, rate limiting.

            Key architectural principles:
            - Agents care about traceability, receipt binding, state invariance
            - Agents reason about verifiable memory through cryptographic proofs
            - All storage operations return cryptographically verifiable receipts
          key_files:
            - gateway/app/core/

        docs:
          repo_path: /Users/zhanson/Desktop/DataLocker
          description: >
            Documentation: API specs, agent briefings, auth docs, schemas.
            AUTHORITATIVE SOURCE for API capabilities.
          system_prompt: |
            You are an expert on Nukez documentation and the
            AUTHORITATIVE SOURCE for API capabilities.
            
            Topics: API documentation, OpenAPI specs, agent briefings,
            authentication documentation, error recovery, tool contracts,
            MCP configurations, discovery schemas.
          key_files:
            - unified_docs/docs/AGENT_BRIEFING.md
            - unified_docs/docs/AUTH_SIGNED_ENVELOPE.md
            - unified_docs/docs/ERROR_RECOVERY.md
            - unified_docs/v1/openapi.json
            - unified_docs/v1/tools.json
            - unified_docs/.well-known/datalocker.json

        frontend:
          repo_path: /Users/zhanson/datalocker-frontend
          description: >
            React frontend with x402 payment protocol integration.
          system_prompt: |
            You are an expert on the Nukez frontend — a React application
            hosted on Firebase with x402 payment protocol integration.
            
            Topics: component hierarchy, routing, state management,
            API integration, x402 payment flow, Firebase deployment,
            neon cyberpunk aesthetics.
          key_files:
            - src/
            - public/
            - firebase.json
            - package.json
            - README.md

    # ────────────────────────────────────────────────────────
