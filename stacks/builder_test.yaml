# yaml-language-server: $schema=
name: builder-test

# ============================================================
# Builder Mode Test Stack
# ============================================================
# Tests the builder pattern: ArchitectAgent plans tasks,
# BuilderAgents write code with validation loops.
#
# Run:
#   maz --config stacks/builder_test.yaml
#   /build Create a Python hello world script
# ============================================================

orchestration:
  mode: builder
  max_iterations: 3

# Architect uses the lead model by default
# Uncomment to use a different model for planning:
# architect:
#   model: claude-opus-4-6

builder_defaults:
  model: claude-sonnet-4-20250514
  max_retries: 3
  max_tokens: 16384
  command_timeout: 60
  validation_commands:
    - "python -m py_compile {file}"

workspace: /tmp/maz-builder-test

lead:
  model: claude-sonnet-4-20250514
  provider: anthropic
  routing_prompt_extra: |
    You are in builder mode. Use /build <task> to plan and execute
    coding tasks. Standard queries are also supported for research.

  agents: {}

disable_files_agent: true
