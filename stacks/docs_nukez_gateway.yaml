                - gateway/app/core/facilitator/
                - gateway/app/core/meta_store/
                - gateway/app/core/pricing/
                - gateway/app/core/storage_providers/
                - tests/

        # ── Twin B: Grok Team ────────────────────────────────
        grok_team:
