            or manage gas.

            **Security** — Ed25519 signature verification (sigverify.py),
            JWT auth (jwt.py), API keys, SSRF protection (ssrf.py), rate
            limiting (rate_limit.py), nonce replay protection (nonce_store.py).
            Each of these is a complete subsystem a user would need to build.

            **Cryptographic attestation** — merkle.py, receipt_proof.py,
            attest.py, attest_jwt.py implement a complete proof chain. This
            replaces an entire compliance/audit infrastructure.

            **IAM-equivalent** — Operator delegation, wallet management,
            locker provisioning. The gateway implements a complete access
            control system without the user touching cloud IAM.

            **Observability** — event_log.py, metrics.py, observability.py,
