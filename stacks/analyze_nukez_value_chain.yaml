            - How this compounds with PyNukez (Layer 1) below it

            AREAS TO COVER (not exhaustive — discover more):

            **Tool packaging** — 8 thick MCP tools with parameter schemas,
            return types, and descriptions. Each tool is a complete capability,
            not a thin endpoint proxy. The developer doesn't design tool
            contracts, write schema definitions, or handle parameter validation.

            **State management** — state.py + state_backend.py provide
            persistent state across tool invocations. LLM hosts are stateless
            by default — the MCP server bridges this gap.

            **Auth cascade** — Keypair resolution from environment variables,
            file paths, or auto-generation. The LLM host never handles crypto.

            **Transport abstraction** — stdio + SSE transports for different
            host environments. The developer doesn't implement MCP transport.

            **Memory module** — memory.py provides structured key-value storage
            for LLM contexts. This is a complete memory layer the developer
            would otherwise need to build.

            **Tool manifest** — tool_manifest.py provides formal MCP tool
            definitions. The developer doesn't write MCP schema JSON.

            **Diagnostics** — Tracing and debugging for MCP tool invocations.

            **PyNukez integration** — The MCP server wraps pynukez methods,
            meaning all of Layer 1's value (auth, types, resilience, etc.)
            is inherited transparently.

            Be exhaustive. Cover every module in the nukez-mcp package.
            Cite file paths for every claim.
