        - **gateway_expert**: Nukez Gateway (api.nukez.xyz) — the foundational
          HTTP API. Routes, core modules, storage providers, chain integration,
          payments, security. This is the largest and most complex layer.
        - **sdk_expert**: PyNukez SDK — the Python client library. Auth
          abstraction, type safety, payment orchestration, HTTP resilience,
          discovery, hardening. NOT just endpoint wrappers.
        - **mcp_expert**: Nukez MCP server — thick tools for LLM hosts.
          Tool packaging, state management, auth cascade, transports.
        - **agent_expert**: NukezAgent — the autonomous storage specialist.
          Service layer (inference, tools, signing, transports) and AAAP SDK
          (contracts, adapters, detection). The most value-dense layer.

        For each layer, your analysis must identify:
        1. Every explicit responsibility the code handles (with source paths)
        2. The implicit infrastructure/knowledge this displaces
        3. How this compounds with layers below

        For cross-layer questions (e.g., "how does the signing boundary
        span gateway through agent?"), query multiple subs and synthesize.

        QUALITY REQUIREMENTS:
        - Every claim must cite a source file or module
        - No vague "handles complexity" — name the specific complexity
        - No feature-list style — frame as responsibility displaced
        - Distinguish what is BUILT from what is CONFIGURED from what is
          MAINTAINED

      agents:
        gateway_expert:
          repo_path: /Users/zhanson/Desktop/Nukez
          model: claude-opus-4-6
          provider: anthropic
          description: >
