            - What the agent handles (specific module, specific code)
            - What a developer/agent system would otherwise need to implement
            - How this compounds with ALL layers below (Gateway + PyNukez + MCP)

            This is the MOST VALUE-DENSE layer because it inherits everything
            below and adds autonomous reasoning, security boundaries, and
            interoperability contracts.

            AREAS TO COVER — SERVICE LAYER (service/):

            **Intent translation** — inference.py + tools.py: Natural language
            → storage operations via Claude tool-use loop. The developer's
            system says "save this file" and the agent handles everything.

            **Signing boundary** — signing.py: SignatureRequired flow,
            EnvelopeBuilder, operator delegation. The agent NEVER possesses
            owner keys or executes crypto transfers. This is a complete
            trust model the developer doesn't design.

            **Tool execution** — tools.py: 9 TOOL_DEFINITIONS covering
