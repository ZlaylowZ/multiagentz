            - What the gateway handles (specific module, specific code)
            - What a user would otherwise need to build, configure, or maintain
            - How this relates to higher layers (PyNukez, MCP, Agent)

            AREAS TO COVER (not exhaustive — discover more):

            **Storage infrastructure** — gateway/app/core/meta_store/ and
            gateway/app/core/storage_providers/ abstract 10+ backends behind
            a unified interface. The user never touches provider SDKs, IAM,
            or bucket configuration.

            **Payment & billing** — gateway/app/core/payments.py,
            evm_payments.py, pricing/ implement the full Solana + EVM payment
