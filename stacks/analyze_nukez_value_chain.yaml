# yaml-language-server: $schema=
name: analyze-nukez-value-chain

# ============================================================
# Nukez Value Chain Analysis
# ============================================================
# Identifies every explicit and implicit responsibility that
# Nukez handles on behalf of agents and users — from the
# foundational HTTP API (Gateway) through the PyNukez SDK,
# the MCP server, and up to the autonomous NukezAgent.
#
# The analysis is NOT a feature list. It is an operational
# decomposition: what effort, knowledge, infrastructure,
# configuration, and maintenance is absorbed at each layer,
# and how the value compounds multiplicatively as one
# ascends the stack.
#
# Architecture (8 agents):
#   Lead (Opus 4.6) — Value chain analyst + synthesizer
#     → researcher (Opus 4.6) — Cloud infra context, implicit costs
#     → analysis_team (Coordinator, Opus 4.6)
#       → gateway_expert   (Opus 4.6)    — Nukez Gateway HTTP API
#       → sdk_expert       (Opus 4.6)    — PyNukez Python SDK
#       → mcp_expert       (Opus 4.6)    — Nukez MCP server
#       → agent_expert     (Opus 4.6)    — NukezAgent service + AAAP SDK
#
# Consensus flow (iterative conflict resolution):
#   1. All agents independently analyze the question
#   2. Conflicts detected across agent responses
#   3. Refinement questions generated for conflicting areas
#   4. Agents refine answers incorporating other perspectives
#   5. Lead synthesizes final deliverable from consensus
#
# The researcher agent provides external context on cloud
# infrastructure costs, IAM complexity, and competing approaches
# that pure codebase analysis would miss. This scopes the
# "implicit value" dimension.
#
# Run:
#   maz --config stacks/analyze_nukez_value_chain.yaml
#   /perspective "[paste the analysis prompt]"
# ============================================================

orchestration:
  mode: consensus
  max_iterations: 2

lead:
  model: claude-opus-4-6
  provider: anthropic

  routing_prompt_extra: |
    You are conducting a rigorous operational decomposition of the Nukez
    ecosystem's value chain — identifying every responsibility (explicit
    and implicit) that Nukez absorbs on behalf of agents and users.

    ## Framing

    This is NOT a feature list or marketing exercise. It is a pragmatic report and analyses 
    of **work displaced** at each layer of the stack. The corollary is that it is each of these
    "layers" are where value creation occurs, competitive positioning established, and the
    business model solidified.
    
    For every responsibility identified, answer:
    1. **What exactly is handled?** — The specific task or concern.
    2. **What would the user/agent otherwise need to do?** — The effort,
       knowledge, infrastructure, or ongoing maintenance required.
    3. **At which layer is it absorbed?** — Gateway, PyNukez, MCP, or Agent.
    4. **How does this compound with lower layers?** — The multiplicative
       value when combined with what layers below already provide.
    5. **Comparative Considersations** Time, effort, labor, financial, technical,
    competence, risk (e.g., security hardening as a benefit), etc... that one has
    to obtain or delegate, which TO BE SURE still requires a level of knowledge that
    is not trivial and cannot be acquired merely by talking to an LLM, to the
    relevant systems and designing process... Specifially, the economic and opportunity costs
    of doing this oneself vs consuming the Nukez protocol which shall include cosiderations of
    all kinds.

    ## The Four Layers (bottom-up)

    **Layer 0 — Nukez Gateway (api.nukez.xyz)**
    The foundational HTTP API. Everything above depends on it.
    Responsibilities to identify include but are not limited to:
    - Cloud infrastructure: storage provider abstraction (10+ backends),
      deployment, scaling, monitoring
    - Billing & payments: Solana + EVM payment processing, pricing engine,
      treasury ledger, 402 protocol
    - Security: Ed25519 signature verification, JWT auth, API key management,
      SSRF protection, rate limiting, nonce replay protection
    - Cryptographic attestation: merkle proof generation, receipt chains,
      on-chain bridging, Arweave sidecar
    - IAM-equivalent: operator delegation, wallet management, locker
      provisioning, access control
    - Observability: event logging, metrics, structured logging

    **Layer 1 — PyNukez SDK (pynukez)**
    The Python client library. NOT merely endpoint wrappers.
    Responsibilities to identify:
    - Auth abstraction: Keypair management, signed envelope construction,
      locker ID computation — the developer never touches raw crypto
    - Type safety: Receipt, FileUrls, FileInfo — structured domain types
      replacing raw JSON
    - Payment orchestration: request_storage → confirm_storage flow
      abstracted into method calls
    - Error taxonomy: classified errors with retry hints
    - HTTP resilience: retry logic, timeout handling in _http.py
    - Zero-knowledge discovery: service discovery without leaking intent
    - Security hardening: request validation in hardening.py

    **Layer 2 — Nukez MCP (nukez-mcp)**
    The MCP server exposing storage as thick tools for LLM hosts.
    Responsibilities to identify:
    - Tool packaging: 8 thick tools with parameter schemas and return types
    - State management: persistent state across tool invocations
    - Auth cascade: keypair resolution from environment
    - Transport abstraction: stdio + SSE for different host environments
    - Memory module: structured key-value storage for LLM contexts

    **Layer 3 — NukezAgent (nukezAgent)**
    The autonomous storage specialist sub-agent.
    Responsibilities to identify:
    - Intent translation: natural language → storage operations
    - Signing boundary: the agent NEVER possesses owner keys, NEVER
      executes crypto transfers — it orchestrates and returns sign_requests
    - Operator delegation: routine ops use agent's own registered keypair
    - Multi-transport: HTTP, MCP, A2A adapters over same core
    - AAAP contracts: Context Envelope, typed Artifacts, capability schemas,
      side effects, failure taxonomy
    - Instance lifecycle: per-developer state, rate limiting
    - Framework integration: CrewAI, LangGraph, AutoGen adapters
    - Agent knowledge: 14 markdown documents for reasoning context
    - Receipt-as-observability: receipt chain IS the trace, no separate system

    ## Implicit / Non-Obvious Value

    Route these questions to the **researcher** agent:
    - What does it actually take to set up cloud storage infrastructure
      from scratch? (IAM policies, billing alerts, provider selection,
      egress cost management, compliance requirements)
    - What does cryptographic attestation normally require? (HSMs, key
      management services, audit trails, compliance frameworks)
    - What is the real cost of multi-chain payment integration? (RPC nodes,
      gas estimation, transaction monitoring, wallet security)
    - What knowledge acquisition burden exists for a developer or agent
      to replicate what each Nukez layer provides?

    ## Your Teams

    **researcher** — Provides external context on infrastructure costs,
    IAM complexity, cloud setup burdens, and knowledge requirements that
    pure codebase analysis cannot capture. Query this agent for the
    "what would you otherwise need to do?" dimension.

    **analysis_team** — Opus 4.6 coordinator team with 4 sub-agents
    covering gateway, SDK, MCP, and agent. Consensus mode's iterative
    conflict resolution ensures blind spots are caught through
    refinement iterations.

    ## Routing Strategy

    1. Start with **researcher** for the implicit value context
    2. Route layer-specific analysis to the analysis team
    3. For cross-layer compounding questions, query the analysis team
       and the researcher

    Expected routing weight:
    - analysis_team: ~70% (the core analysis)
    - researcher: ~30% (infrastructure context and implicit value)

    ## Output Format

    Produce a structured deliverable with these sections:

    ### 1. Executive Summary
    One-paragraph thesis on the multiplicative value chain.

    ### 2. Layer-by-Layer Decomposition
    For each layer (Gateway → PyNukez → MCP → NukezAgent):
    - **Explicit responsibilities** — What the code demonstrably handles,
      with source citations (file paths, module names).
    - **Implicit responsibilities** — Infrastructure, knowledge, and
      maintenance that users/agents never see but would otherwise bear.
    - **Compounding value** — How this layer's value multiplies with
      layers below it.

    ### 3. Cross-Cutting Concerns
    Responsibilities that span multiple layers:
    - Security (signing, auth, access control across all layers)
    - Observability (receipt chain, logging, metrics)
    - Error handling (taxonomy, retries, graceful degradation)
    - State management (lockers, instances, memory)

    ### 4. The Multiplicative Thesis
    A concrete walkthrough: if a developer wanted to replicate the full
    NukezAgent experience from scratch, what is the complete inventory
    of infrastructure, code, knowledge, and ongoing maintenance required
    at each layer? Show how the effort compounds.

    ### 5. Value Gradient Table
    A table with columns: Responsibility | Gateway | PyNukez | MCP | Agent |
    showing where each responsibility is absorbed and what it would cost
    to self-implement.

    ## Refinement Criteria (Iteration 2)

    When reviewing the first pass, focus on:
    1. **Completeness** — Are there responsibilities that were missed?
       Check every module, every route, every tool definition.
    2. **Accuracy** — Are source citations correct? Do the claims match
       the actual code?
    3. **Implicit value gaps** — Did the analysis adequately capture the
       non-obvious burdens (billing setup, IAM, compliance, knowledge
       acquisition)?
    4. **Compounding logic** — Is the multiplicative argument rigorous
       or hand-wavy? Each compounding claim needs a concrete example.

    Do NOT pad with filler. Every sentence must either identify a
    responsibility, cite a source, or make a compounding argument.

  keywords:
    researcher:
      - infrastructure
      - cloud
      - IAM
      - billing
      - compliance
      - cost
      - setup
      - knowledge
      - effort
      - alternative
      - competing
      - from scratch
      - otherwise
      - implicit
      - non-obvious
      - hidden
      - burden
      - maintenance
      - HSM
      - key management
      - RPC node
      - gas

    analysis_team:
      - gateway
      - pynukez
      - sdk
      - mcp
      - agent
      - nukez
      - storage
      - receipt
      - signing
      - locker
      - provision
      - payment
      - attestation
      - merkle
      - operator
      - wallet
      - tool
      - route
      - endpoint
      - explicit
      - code
      - module
      - layer

  agents:
    # ══════════════════════════════════════════════════════════
    # Researcher — External context on infra costs & knowledge
    # ══════════════════════════════════════════════════════════
    researcher:
      model: claude-opus-4-6
      provider: anthropic
      description: >
        Infrastructure and knowledge-burden researcher. Provides external
        context on what it actually takes to build, configure, and maintain
        the cloud infrastructure, cryptographic systems, blockchain
        integrations, and IAM policies that Nukez abstracts away.
        Answers the "what would you otherwise need to do?" question
        for each layer of the stack.
      system_prompt: |
        You are a senior infrastructure and platform engineering researcher.
        Your role is to provide rigorous, specific answers about the REAL
        costs and complexity of building and maintaining the systems that
        Nukez absorbs on behalf of its users.

        You are NOT analyzing the Nukez codebase. You are providing the
        COUNTERFACTUAL: what a developer or agent would need to do WITHOUT
        Nukez at each layer.

        Be specific and technical. Cite concrete AWS/GCP/Azure services,
        specific IAM permissions, actual cost ranges where known. Do not
        generalize. The reader is technical — give them the real picture.

        When you don't have specific data, say so — don't fabricate numbers.
        Distinguish between your direct knowledge and estimates.

    # ══════════════════════════════════════════════════════════
    # Analysis Team (Opus 4.6)
    # ══════════════════════════════════════════════════════════
    analysis_team:
      type: coordinator
      model: claude-opus-4-6
      provider: anthropic
      max_workers: 8
      description: >
        Analysis team for the Nukez value chain decomposition.
        Routes to 4 domain-specific sub-agents covering the gateway,
        SDK, MCP, and the nukez-agent.
      routing_prompt_extra: |
        You lead the analysis team for the Nukez value chain decomposition.
