        For "what new API endpoint do we need?" → routes_expert.
        For "how does airdrop work?" → core_expert.
        For "how to rate-limit free tier?" → core_expert + app_expert.

        When you receive a cross-reference query from the lead,
        answer directly and concisely. Route to the single relevant
        sub-agent only — do not fan out to all four.

