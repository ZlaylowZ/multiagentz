    # ══════════════════════════════════════════════════════════
    # Team 3: SDK — python/nukez/ package
    # ══════════════════════════════════════════════════════════
    sdk_team:
      type: coordinator
      model: claude-sonnet-4-20250514
      provider: anthropic
      description: >
        Planning team for the python/nukez/ AAAP SDK package.
        Lighter involvement — follows service decisions.
      routing_prompt_extra: |
        You oversee the python/nukez/ SDK package — the programmatic
        interface to NukezAgent with AAAP contracts.

        Two sub-agents:
        - **standalone_expert**: StandaloneAgent class, CrewAI adapter,
          how the SDK wraps pynukez with ContextEnvelope/Artifact.
        - **detect_expert**: Framework detection (detect.py), execution
          mode detection, auto-configuration.

        This is the lightest team. Most decisions follow from the
        service_team's hardening work. Focus on: does the SDK expose
        the same capabilities as the service? Are the contracts
        (envelope, artifact, ledger) correctly integrated?

        When you receive a cross-reference query, answer concisely.

      agents:
        standalone_expert:
          repo_path: /Users/zhanson/Desktop/nukezAgent
          model: gpt-5.4
          provider: openai
          description: >
            Expert on the StandaloneAgent class and framework adapters.
          system_prompt: >
            You are the expert on the python/nukez/ SDK package.

            CORE CLASS — python/nukez/adapters/standalone.py:
            StandaloneAgent wraps pynukez.Nukez with AAAP contracts.
            Every method accepts ContextEnvelope, returns Artifact + trace.
            It uses SessionLedger from ledger.py.

            CREWAI ADAPTER — python/nukez/adapters/crewai.py:
            Wraps StandaloneAgent for CrewAI framework.

            KEY QUESTIONS:
            1. Does StandaloneAgent support all 9 operations that the
               service supports? (store, retrieve, list, delete, verify,
               status, provision, store_memory, recall_memory)
            2. Is the signing flow handled? StandaloneAgent has its own
               keypair via resolve_keypair — does it handle the operator
               delegation vs owner signing distinction?
            3. Is the SessionLedger wired in to every operation?
            4. Is the CrewAI adapter complete?
          key_files:
            - python/nukez/adapters/standalone.py
            - python/nukez/adapters/crewai.py
            - python/nukez/adapters/__init__.py
            - python/nukez/__init__.py
            - python/nukez/ledger.py
            - python/nukez/envelope.py
            - python/nukez/artifacts.py
            - python/nukez/auth.py
            - python/tests/test_standalone.py
            - python/tests/test_integration.py
            - python/tests/test_ledger.py
            - python/pyproject.toml
            - python/README.md

        detect_expert:
          repo_path: /Users/zhanson/Desktop/nukezAgent
          model: claude-sonnet-4-20250514
          provider: anthropic
          description: >
            Expert on framework detection and execution mode configuration.
          system_prompt: >
            You are the expert on NukezAgent framework detection and
            auto-configuration.

            - python/nukez/detect.py: detect_framework() checks sys.modules
              for crewai/autogen/langgraph. detect_mode() checks env vars
              for sidecar/embedded/remote.
            - python/tests/test_detect.py: Tests for detection logic.

            Assess: Is the detection robust? Are there other frameworks
            to support (e.g., Claude Agent SDK, OpenAI Agents SDK)?
            Should detection influence which adapter is auto-selected?
          key_files:
            - python/nukez/detect.py
            - python/tests/test_detect.py
            - python/nukez/adapters/__init__.py

    # ══════════════════════════════════════════════════════════
    # Team 4: Substrate — pynukez + gateway (READ-ONLY)
    # ══════════════════════════════════════════════════════════
    substrate_team:
      type: coordinator
      model: claude-opus-4-6
      provider: anthropic
      description: >
        Planning team for the external substrate: pynukez SDK and
        gateway API. These repos are READ-ONLY — we don't modify them,
        but we need to understand their APIs deeply.
      routing_prompt_extra: |
        You oversee understanding of the external substrate that
        NukezAgent builds on. These are READ-ONLY dependencies.

        Two sub-agents:
        - **pynukez_expert**: The pynukez SDK — Keypair, build_signed_envelope,
          compute_locker_id, Nukez client (all storage operations),
          payment flows (solana_transfer, evm_transfer, request_storage,
          confirm_storage), types (Receipt, FileUrls, FileInfo).
          Critical for understanding what service/tools.py ToolExecutor
          calls through the pynukez client.
        - **gateway_expert**: The gateway at api.nukez.xyz — routes,
          storage provisioning, payment processing, attestation,
          rate limiting, signed request verification. Critical for
          understanding the backend the service talks to.

        These repos are NOT being modified in this plan. Route here
        when the service_team or contracts_team needs to understand
        what APIs are available, what the substrate supports, or what
        constraints it imposes.

        When you receive a cross-reference query, answer with specific
        method signatures, endpoint paths, and parameter shapes.

      agents:
        pynukez_expert:
          repo_path: /Users/zhanson/pynukez
          model: gpt-5.4
          provider: openai
          description: >
            Definitive expert on the pynukez SDK — the Python client
            library that NukezAgent's ToolExecutor depends on.
          system_prompt: >
            You are the definitive expert on pynukez (v3.1.0).

            The NukezAgent service creates a Nukez client instance and
            calls its methods from ToolExecutor. Understanding these
            methods is critical for the hardening plan:

            - auth.py: Keypair class, build_signed_envelope,
              compute_locker_id — the signing primitives
            - client.py: Nukez class — store, retrieve, list_files,
              delete, verify, get_status, request_storage,
              confirm_storage, provision_locker, solana_transfer,
              evm_transfer, reconstruct_state
            - types.py: Receipt, FileUrls, FileInfo, StorageRequest

            KEY QUESTIONS:
            1. What does request_storage return? What fields does the
               StorageRequest have? (Needed to understand what happens
               when payment is removed from service/tools.py)
            2. Does provision_locker work with just a receipt_id, or
               does it require the full payment flow first?
            3. What retry/timeout support does the Nukez client have?
            4. What errors can the client raise? Are they classifiable
               as transient vs permanent?
          key_files:
            - pynukez/__init__.py
            - pynukez/client.py
            - pynukez/auth.py
            - pynukez/types.py
            - pynukez/_http.py
            - pynukez/errors.py
            - pynukez/payment.py
            - pynukez/evm_payment.py
            - pynukez/hardening.py
            - pynukez/discovery.py
            - docs/API.md
            - docs/QUICKSTART.md
            - tests/

        gateway_expert:
          repo_path: /Users/zhanson/Desktop/Nukez
          model: gpt-5.4
          provider: openai
          description: >
            Expert on the Nukez gateway (api.nukez.xyz) — the backend
            that the NukezAgent service communicates with.
          system_prompt: >
            You are the expert on the Nukez gateway (api.nukez.xyz).

            The NukezAgent service talks to this gateway for ALL storage
