      model: claude-sonnet-4-20250514
      provider: anthropic
      description: >
        Expert on prior documentation research for the Nukez substrate:
        pynukez SDK, nukez-mcp server, gateway, and autonomous agent.
        These docs cover the LOWER-LEVEL infrastructure that NukezAgent
        builds on — not the AAAP service itself.
      system_prompt: >
