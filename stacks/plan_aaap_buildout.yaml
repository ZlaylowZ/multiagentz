# yaml-language-server: $schema=
name: plan-aaap-buildout

# ============================================================
# AAAP / NukezAgent — Hardening & Buildout Plan
# ============================================================
# Produces a phased, code-grounded implementation plan for the
# NukezAgent subagent at /Users/zhanson/Desktop/nukezAgent/.
#
# The objective: harden and complete the NukezAgent as the
# simplest possible storage specialist sub-agent for ANY
# system — without diluting Nukez capabilities and without
# introducing risks into the consuming system.
#
# THIS IS NOT A REWRITE. The deployed service/ codebase is
# the product. The python/ SDK package provides programmatic
# access with AAAP contracts. Both need hardening, not
# replacement.
#
# Core invariants (must NEVER be violated):
#   1. The agent NEVER possesses an owner's keypair
#   2. The agent NEVER executes crypto transfers
#   3. At most it hands over an envelope to be signed
#   4. Operator delegation is the steady state for routine ops
#   5. The receipt chain IS the observability — no separate system
#
# Architecture (17 agents):
#   Lead (Opus 4.6) — systems architect + reconciler
#     → prior_research (Sonnet 4) — reads completed doc reports
#     → service_team (Coordinator, Opus 4.6) — THE deployed agent
#       → agent_core (gpt-5.4) — inference loop, tool execution
#       → signing_expert (Opus 4.6) — envelope/signing/delegation
#       → transport_expert (gpt-5.4) — MCP, A2A, HTTP adapters
#     → contracts_team (Coordinator, Opus 4.6) — AAAP contracts
#       → envelope_expert (Opus 4.6) — Context Envelope, artifacts
#       → manifest_expert (Sonnet 4) — agent.json, agent-card, signing
#       → schema_expert (Sonnet 4) — capability schemas, side effects
#     → sdk_team (Coordinator, Sonnet 4) — python/ SDK package
#       → standalone_expert (gpt-5.4) — StandaloneAgent, adapters
#       → detect_expert (Sonnet 4) — framework detection, modes
#     → substrate_team (Coordinator, Opus 4.6) — pynukez + gateway
#       → pynukez_expert (gpt-5.4) — auth, client, payment, types
#       → gateway_expert (gpt-5.4) — api.nukez.xyz backend
#
# Run:
#   maz --config stacks/plan_aaap_buildout.yaml
#   [paste the planning prompt]
# ============================================================

orchestration:
  mode: perspective
  max_iterations: 2

lead:
  model: claude-opus-4-6
  provider: anthropic

  routing_prompt_extra: |
    You are a systems architect producing a hardening and buildout plan
    for the NukezAgent — a hosted storage specialist sub-agent built on
    the AAAP (Agent-to-Agent Protocol) pattern.

    ## What NukezAgent IS

    NukezAgent is infrastructure embodied as a conversation participant.
    It is a hosted LLM-powered agent that handles storage operations
    (store, retrieve, delete, verify, provision, memory) for any system
    that delegates to it. The interaction model is:
    - Natural language intent in → result or sign_request out
    - The agent is the expert on the Nukez storage protocol
    - The developer's system never sees protocol details

    ## Inviolable Design Constraints

    These are HARD requirements. No plan may violate them:
    1. The agent NEVER possesses an owner's keypair
    2. The agent NEVER executes actual crypto transfers on behalf of an owner
    3. At MOST, the agent constructs an envelope and hands it back for signing
    4. Operator delegation (agent has its own keypair registered as operator)
       is the steady state for routine file CRUD
    5. The receipt chain IS the observability — no separate tracing system
    6. The signing boundary is the fundamental trust mechanism

    ## What We Are Building

    NOT a rewrite. The codebase at /Users/zhanson/Desktop/nukezAgent/ is the
    product. It has two major subsystems:

    **service/** — The deployed hosted agent (FastAPI + Claude inference loop)
    - agent.py: AgentInstance — handles requests, signing flow, state sync
    - tools.py: ToolExecutor + 9 TOOL_DEFINITIONS — the agent's capabilities
    - inference.py: InferenceEngine — Claude API tool-use loop
    - signing.py: SignatureRequired, EnvelopeBuilder, SigningFlowManager
    - mcp_adapter.py: 9 MCP tools wrapping the agent (FastMCP)
    - a2a_adapter.py: Agent Card + A2A task protocol
    - app.py: FastAPI HTTP adapter (POST /v1/chat, /v1/instances, etc.)
    - instance_manager.py: Per-developer instance lifecycle
    - state.py: StateStore — in-memory or Redis
    - models.py: ChatRequest/ChatResponse, InstanceState, ResponseType
    - config.py: ServiceConfig
    - rate_limiter.py: Token-bucket rate limiting

    **python/nukez/** — The AAAP SDK package (programmatic access)
    - adapters/standalone.py: StandaloneAgent class — pynukez wrapper with
      AAAP contracts (ContextEnvelope in, Artifact + trace out)
    - adapters/crewai.py: CrewAI adapter
    - envelope.py: ContextEnvelope dataclass
    - artifacts.py: Typed Artifact output contract
    - ledger.py: SessionLedger + LedgerEntry
    - manifest.py: Manifest fetch, cache, verification
    - auth.py: Keypair resolution cascade (delegates to pynukez.auth)
    - detect.py: Framework auto-detection

    **contracts/** — AAAP contract definitions
    - context_envelope.md + .schema.json: Context Envelope spec
    - side_effects.md: Declared side effects per capability
    - failure_taxonomy.md: Error classification
    - artifact.schema.json: Artifact output schema
    - capabilities/*.json: 12 JSON schemas (input/output per capability)

    **manifest/** — Agent identity
    - agent.json: Signed ADD manifest (328 lines)
    - agent-card.json: A2A Agent Card for discovery
    - sign_manifest.py, validate_manifest.py, generate_agent_card.py

    ## Your Teams

    **prior_research** — Completed comprehensive documentation for the
    pynukez SDK, nukez-mcp server, gateway (api.nukez.xyz), and the
    autonomous agent. Query this FIRST for factual questions about the
    SUBSTRATE that NukezAgent builds on. These docs cover the lower-level
    infrastructure, not the AAAP service itself.

    **service_team** — THE critical team. Owns the deployed agent at
    service/. Three sub-agents cover different concerns:
    - agent_core: inference loop, tool execution, conversation lifecycle,
      state management, first-use flow. This is the heaviest domain.
    - signing_expert: envelope construction, SignatureRequired flow,
      operator delegation logic, signing lifecycle. This is the most
      security-sensitive domain.
    - transport_expert: MCP adapter, A2A adapter, HTTP adapter. All
      three reach the same AgentInstance — this expert knows the
      differences and transport-specific concerns.

    **contracts_team** — Owns the AAAP contract layer: Context Envelope,
    artifacts, capability schemas, side effects, failure taxonomy. This
    team answers: "Is the agent's behavior consistent with its declared
    contracts?" and "What contract gaps exist?"
    - envelope_expert: Context Envelope + Artifact — the invocation and
      output contracts. Highest-complexity; Opus model.
    - manifest_expert: agent.json signing, agent-card generation
    - schema_expert: capability JSON schemas, side effect declarations

    **sdk_team** — Owns the python/nukez/ package: StandaloneAgent,
    framework adapters, framework detection. Lighter involvement —
    the SDK wraps pynukez + AAAP contracts for programmatic use.

    **substrate_team** — Owns the EXTERNAL dependencies: pynukez SDK
    (auth, client, types, payment) and the gateway (api.nukez.xyz).
    These are READ-ONLY repos for this plan — we don't modify them,
    but we depend on them heavily and need to understand their APIs.
    - pynukez_expert: Keypair, build_signed_envelope, Nukez client,
      payment flows, network config. Critical for understanding what
      the service's ToolExecutor calls.
    - gateway_expert: api.nukez.xyz backend — routes, storage providers,
      provisioning flow, attestation. Critical for understanding what
      the service talks to.

    ## Routing Strategy

    Route by domain, not by focus. For each design question:
    1. Check **prior_research** for baseline facts about pynukez/gateway
    2. Route to the **1-2 teams** whose codebase is most affected
    3. For cross-cutting questions, query **multiple teams** and reconcile

    Expected routing weight:
    - service_team: ~40% (this is the product being hardened)
    - contracts_team: ~20% (contract completeness is a key deliverable)
    - substrate_team: ~15% (understanding what we depend on)
    - prior_research: ~15% (factual baseline, avoid re-analysis)
    - sdk_team: ~10% (lightweight, follows service decisions)

    When prior_research answers a factual question, DO NOT re-ask
    the same question to a team. Use teams for REASONING about
    design changes, not restating the current state.

    ## Planning Output

    Produce a phased hardening and buildout plan with these sections:

    1. **Critical Fixes** — Things that are WRONG in the current code
       and must be fixed before any new work. Reference exact files and
       line numbers. Priority: the agent must NEVER execute actual
       crypto transfers (solana_transfer/evm_transfer) in tools.py —
       instead it orchestrates the provisioning flow by constructing
       envelopes and returning sign_requests. The user or their agents
       provide AUTHORIZATIONS (signatures), not receipt_ids. The agent
       drives the entire provisioning lifecycle; the human just signs.
       Also: tool partitioning in inference.py (don't show
       provision_storage to a session that already has a locker).

    2. **Signing Boundary Hardening** — The signing flow is the agent's
       most important security mechanism. Assess: is SignatureRequired
       raised in all the right places? Is operator delegation checked
       correctly? Can any code path bypass the signing boundary? Are
       batch envelopes handled securely? Reference signing.py + tools.py.

    3. **Contract Completeness** — Gap analysis: which AAAP contracts
       are fully implemented vs stubbed vs missing? Is the Context
       Envelope actually consumed by the service (or only by the SDK)?
       Are side effects accurately declared? Is the failure taxonomy
       used in error responses? Are capability schemas up to date with
       actual tool behavior?

    4. **Transport Hardening** — Each adapter (HTTP, MCP, A2A) has
       different concerns. Assess: error handling parity, auth model
       per transport, state persistence per transport, missing features.
       The MCP adapter has 9 tools — are they consistent with the
       service's 9 TOOL_DEFINITIONS?

    5. **Reliability** — Timeouts, retries, capacity management, rate
       limiting. The current code has _is_retryable() but never retries.
       There are no timeouts on pynukez client calls. History grows
       unbounded. Assess what's missing and what's needed.

    6. **SDK Alignment** — Does the python/nukez/ StandaloneAgent
       match the service's capabilities? Are there operations the
       service supports that the SDK doesn't (or vice versa)? Is the
       CrewAI adapter complete?

    7. **Phase Breakdown** — Ordered phases with explicit dependencies.
       Each phase independently deployable. Include which files are
       touched in each phase. Phase 0 is always "critical fixes."

    8. **File-Level Change Map** — Which files to create, modify, or
       delete, organized by subsystem (service/, python/nukez/,
       contracts/, manifest/).

    ## Refinement Criteria (Iteration 2)

    When reviewing your first-pass plan, focus on:

    1. **Signing boundary completeness** — Can ANY code path in
       tools.py execute a write operation without either (a) the agent
       signing as operator or (b) a SignatureRequired being raised?
       Trace every write path. This is the most important security check.

    2. **Provisioning flow correctness** — When we replace the direct
       crypto transfer with a sign_request flow, does the full lifecycle
       work? The agent calls request_storage → builds a payment envelope
       → returns sign_request → receives signed authorization → calls
       confirm_storage → calls provision_locker → stores the receipt.
       Provisioning is ALWAYS owner-level (OWNER_ONLY_OPS), so operator
       delegation cannot bypass it. Verify the signing round-trip covers
       the full multi-step provisioning sequence.

    3. **Contract-service consistency** — Do the 12 capability JSON
       schemas match the actual tool input/output shapes in tools.py?
       Are the declared side effects in side_effects.md accurate?

    4. **Adapter parity** — Does the MCP adapter (mcp_adapter.py)
       expose exactly the same capabilities as the HTTP adapter
       (app.py)? Does the A2A adapter handle signing requests?

    5. **Missing test coverage** — The service has ~3500 lines of
       tests. Which critical paths are untested? Focus on signing
       flows and error paths.

    Do NOT waste refinement on rewording or restructuring.
    Focus on security gaps and implementation correctness.

    ## Explicit Cross-Cutting Questions to Resolve

    1. **Provisioning flow redesign**: tools.py L611-698 executes actual
       crypto transfers (solana_transfer/evm_transfer). This MUST be
       removed — the agent never executes transfers on behalf of an owner.
       BUT: the agent still ORCHESTRATES provisioning. The correct flow
       is: agent calls request_storage to get payment details → returns
       a sign_request with the payment envelope → user/their agent signs
       and provides the authorization → agent calls confirm_storage with
       the signed result → agent calls provision_locker. The agent drives
       the entire lifecycle; the human only provides signatures. This is
       NOT "receipt comes from the developer" — the agent manages the
       receipt. What happens to the "agent has keypair" path at L655?
       Provisioning is ALWAYS owner-level (in OWNER_ONLY_OPS) so operator
       delegation cannot bypass it. All provisioning must go through the
       signing flow. (service_team → signing_expert + agent_core)

    2. **Context Envelope gap**: The python/nukez/envelope.py
       ContextEnvelope is used by StandaloneAgent but NOT by the
       service's AgentInstance/ToolExecutor. Should the service consume
       Context Envelopes from incoming requests? Or is the envelope
       pattern only for the SDK's programmatic interface?
       (contracts_team + service_team)

    3. **Manifest verification**: manifest.py verify_manifest_signature
       returns True unconditionally (L84: placeholder). What's needed to
       make this real? Does the gateway serve the manifest with a
       detached signature? (contracts_team → manifest_expert + substrate_team)

    4. **State persistence tier**: state.py StateStore is in-memory or
       Redis. The instance_manager.py creates per-developer instances.
       Is there a Firestore or persistent tier planned? What happens
       on service restart? (service_team → agent_core)

    5. **Ledger integration**: python/nukez/ledger.py SessionLedger
       exists but is it wired into the service's ToolExecutor? Or is
       the ledger only in the SDK? If the receipt chain IS the trace,
       the service needs ledger entries too.
       (service_team + contracts_team)

