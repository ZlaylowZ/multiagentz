# yaml-language-server: $schema=
name: docs-nukez-docs

# ============================================================
# Nukez Docs Site — Agent-Native Documentation Review & Plan
# ============================================================
# The nukez-docs repo (docs.nukez.xyz) is the Firebase-hosted
# documentation discovery endpoint for the Nukez ecosystem.
# Unlike project docs, this is AGENT-NATIVE documentation:
# machine-readable discovery, OpenAPI specs, tool contracts,
# LLM indexes, and agent briefing guides.
#
# This stack reviews the docs site for completeness, accuracy,
# and agent discoverability — then produces a buildout plan.
#
# The docs site is DERIVED FROM the gateway (api.nukez.xyz),
# but its purpose is agent consumption, not human browsing.
#
# Architecture:
#   Lead (Opus 4.6) @ /nukez-docs (root)
#     → docs_coordinator (Opus 4.6) @ /nukez-docs
#       → discovery_expert (Opus 4.6): .well-known/, schemas/, discovery
#       → api_spec_expert (gpt-5.4): v1/, openapi.json, tool contracts
#       → agent_guides_expert (Grok 4.1 reasoning): docs/ agent guides
#       → gateway_source (gpt-5.4): gateway source of truth (read-only)
#
# Run:
#   maz --config stacks/docs_nukez_docs.yaml
#   /perspective "[paste prompt]"
# ============================================================

orchestration:
  mode: perspective
  max_iterations: 2

lead:
  model: claude-opus-4-6
  provider: anthropic
  repo_path: /Users/zhanson/nukez-docs

  routing_prompt_extra: |
    You are orchestrating a comprehensive review and buildout plan for
    docs.nukez.xyz — the Nukez ecosystem's agent-native documentation
    discovery endpoint.

    ## What This Repo IS

    This is NOT a typical documentation site. It is a **machine-readable
    discovery surface** designed for autonomous agents and LLM hosts to
    find, understand, and integrate with the Nukez storage protocol.

    The audience is:
    1. **LLM inference engines** — consuming llms.txt, tools.json, and
       OpenAPI specs to understand what Nukez can do
    2. **MCP hosts** — discovering the Nukez MCP server via .well-known/mcp.json
    3. **Autonomous agents** — reading AGENT_BRIEFING.md and AGENT_FLOW.md
       to learn how to use Nukez storage end-to-end
    4. **Agent frameworks** — discovering capabilities via nukez.json and
       the tool contract schema

    The content is DERIVED from the gateway at api.nukez.xyz, but the docs
    site packages it for agent consumption with additional context,
    discovery endpoints, and LLM-friendly formatting.

    ## Repo Structure

    **Discovery layer** — Machine-readable entry points:
    - `.well-known/nukez.json` — Primary Nukez discovery document
    - `.well-known/ai-plugin.json` — AI plugin manifest (ChatGPT-style)
    - `.well-known/mcp.json` — MCP server manifest
    - `schemas/nukez.discovery.v1.schema.json` — Discovery schema

    **API specifications** — Tool and endpoint contracts:
    - `v1/tools.json` — LLM-friendly tool definitions
    - `v1/tool_contract.json` — Full tool contract with side effects
    - `v1/openapi.json` + `v1/openapi.yaml` — OpenAPI v3 spec
    - `v1/openapi_file_management.yaml` — File management subset
    - `openapi.json` — Root-level full OpenAPI bundle

    **Agent guides** — Markdown docs for agent consumption:
    - `docs/AGENT_BRIEFING.md` — Start-here guide for agents
    - `docs/AGENT_FLOW.md` — End-to-end storage walkthrough
    - `docs/AUTH_SIGNED_ENVELOPE.md` — Ed25519 auth protocol
    - `docs/AUTH_CAP_TOKEN.md` — Capability token auth
    - `docs/ERROR_RECOVERY.md` — Failure handling patterns
    - `docs/TRUST_BOUNDARY_STATUS.md` — Trust model status
    - `docs/AGENT_DOCS_AUDIT.md` — Prior documentation audit
    - `docs/CHANGELOG.md` — Version history

    **LLM index** — Compact references for model context:
    - `llms.txt` — Short index (URLs + core behavior summary)
    - `llms-full.txt` — Full index with complete detail

    **Site infrastructure** — Firebase hosting + landing page:
    - `firebase.json` — Hosting config, headers, redirects, CORS
    - `index.html` — Landing page (cyberpunk circuit board theme)
    - `robots.txt`, `sitemap.xml` — SEO/crawlability

    ## Key Assessment Questions

    Your review and plan should address:

    1. **Discovery completeness** — Can an agent starting from ONLY
       `docs.nukez.xyz` discover everything it needs? Is the discovery
       chain (nukez.json → tools.json → OpenAPI → guides) seamless?

    2. **Gateway sync** — Are the OpenAPI specs, tool contracts, and
       agent guides in sync with the actual gateway at api.nukez.xyz?
       What's stale or missing?

    3. **Agent guide quality** — Are AGENT_BRIEFING.md and AGENT_FLOW.md
       sufficient for an LLM to autonomously use Nukez storage? What
       gaps would cause an agent to fail or get stuck?

    4. **NukezAgent integration** — The NukezAgent at
       /Users/zhanson/Desktop/nukezAgent is the agent that consumes
       these docs. Does the docs site advertise NukezAgent's existence?
       Should there be a discovery path from docs.nukez.xyz to the
       NukezAgent manifest/agent-card?

    5. **MCP discoverability** — Is .well-known/mcp.json complete
       enough for an MCP host to auto-configure the Nukez MCP server?

    6. **Schema validation** — Does nukez.discovery.v1.schema.json
       actually validate against the nukez.json discovery document?

    7. **Missing content** — What agent-native documentation is missing?
       (e.g., memory operations, operator delegation guide, payment
       flow guide, multi-chain guide, verification/attestation guide)

    Delegate domain-specific analysis to the docs_coordinator.

  keywords:
    docs_coordinator:
      - discovery
      - openapi
      - tool
      - contract
      - schema
      - agent
      - briefing
      - flow
      - auth
      - llms
      - mcp
      - well-known
      - firebase
      - guide
      - spec
      - gateway
      - sync
      - landing
      - sitemap

  agents:
    docs_coordinator:
      type: coordinator
      model: claude-opus-4-6
      provider: anthropic
      repo_path: /Users/zhanson/nukez-docs
      description: >
        Coordinator for nukez-docs review and buildout. Oversees four
        sub-agents covering discovery endpoints, API specifications,
        agent guides, and the gateway source of truth for sync validation.
      routing_prompt_extra: |
        You oversee the review and buildout plan for docs.nukez.xyz.
        Four sub-agents cover different domains:

        - **discovery_expert** (Opus 4.6): The machine-readable discovery
          layer — .well-known/ endpoints, nukez.json, ai-plugin.json,
          mcp.json, the discovery schema, llms.txt/llms-full.txt,
          and the site infrastructure (firebase.json, sitemap.xml,
          robots.txt, index.html). Assesses: is the discovery chain
          complete? Can an agent bootstrap from zero?

        - **api_spec_expert** (gpt-5.4): The API specification layer —
          v1/tools.json, v1/tool_contract.json, OpenAPI specs (v1/ and
          root-level). Assesses: are tool definitions accurate and
          complete? Do OpenAPI specs match gateway reality?

        - **agent_guides_expert** (Grok 4.1 reasoning): The agent guide
          layer — all docs/*.md files. Assesses: are the guides
          sufficient for autonomous agent usage? What's missing or
          stale? Applies reasoning to identify gaps an agent would
          hit during actual execution.

        - **gateway_source** (gpt-5.4): READ-ONLY access to the Nukez
          gateway at /Users/zhanson/Desktop/Nukez. Used to validate
          that docs site content matches the actual gateway. Route
          sync-check questions here: "Does the OpenAPI spec match the
          actual routes?" "Is the tool contract current?"

        Routing strategy:
        - Discovery endpoints, site infra, LLM indexes → discovery_expert
        - Tool definitions, OpenAPI specs, API contracts → api_spec_expert
        - Agent guides, briefings, auth docs → agent_guides_expert
        - "Does this match the gateway?" → gateway_source
        - Cross-cutting (e.g., "is the discovery chain consistent with
          the API spec?") → query both relevant agents and synthesize

      agents:
        discovery_expert:
          repo_path: /Users/zhanson/nukez-docs
          model: claude-opus-4-6
          provider: anthropic
          description: >
            Expert on the docs site's machine-readable discovery layer:
            .well-known/ endpoints, discovery schema, LLM indexes,
            sitemap, robots.txt, firebase hosting config, and the
            landing page. Assesses agent bootstrapping completeness.
          system_prompt: >
            You are the expert on docs.nukez.xyz's discovery surface —
            the machine-readable endpoints that allow agents and LLM
            hosts to find and understand Nukez.

            Your domain:
            - .well-known/nukez.json — The primary discovery document.
              An agent starting here should be able to find everything.
            - .well-known/ai-plugin.json — AI plugin manifest for
              ChatGPT-style plugin discovery.
            - .well-known/mcp.json — MCP server manifest for hosts
              like Claude Desktop and Cursor.
            - schemas/nukez.discovery.v1.schema.json — JSON Schema for
              the discovery document format.
            - llms.txt — Short LLM index (URLs + behavior summary).
            - llms-full.txt — Full LLM index with complete detail.
            - firebase.json — Hosting config: CORS headers, caching,
              redirects, content types. Critical for agent access.
            - sitemap.xml — Crawlability map.
            - robots.txt — Crawler permissions.
            - index.html — Human-facing landing page.

            KEY QUESTIONS:
            1. Does nukez.json contain all necessary links to tools.json,
               OpenAPI, agent guides, and the MCP manifest?
            2. Is the discovery chain zero-click? (Agent reads nukez.json
               → finds tools.json → finds OpenAPI → finds guides)
            3. Are CORS headers correct for cross-origin agent access?
            4. Is llms.txt/llms-full.txt up to date with current endpoints?
            5. Does mcp.json have enough info for auto-configuration?
            6. Does the sitemap cover all agent-relevant resources?
            7. Should there be a link to the NukezAgent agent-card for
               agent-to-agent discovery?

            Ground every answer in the actual file contents.
          key_files:
            - .well-known/nukez.json
            - .well-known/ai-plugin.json
            - .well-known/mcp.json
            - schemas/nukez.discovery.v1.schema.json
            - llms.txt
            - llms-full.txt
            - firebase.json
            - sitemap.xml
            - robots.txt
            - index.html

        api_spec_expert:
          repo_path: /Users/zhanson/nukez-docs
          model: gpt-5.4
          provider: openai
          description: >
            Expert on the API specification layer: tool definitions,
            tool contracts, OpenAPI specs, and their accuracy relative
            to the gateway they describe.
          system_prompt: >
            You are the expert on the API specifications hosted at
            docs.nukez.xyz — the machine-readable contracts that tell
            agents exactly how to call the Nukez storage API.

            Your domain:
            - v1/tools.json — LLM-friendly tool definitions. These are
              what an LLM sees when deciding which Nukez operation to
              call. Must be clear, complete, and accurate.
            - v1/tool_contract.json — Full tool contract including side
              effects, failure modes, and capability declarations.
            - v1/openapi.json + v1/openapi.yaml — OpenAPI v3 spec for
              the Nukez API. The canonical machine-readable reference.
            - v1/openapi_file_management.yaml — File management subset
              of the OpenAPI spec.
            - openapi.json — Root-level OpenAPI bundle (may differ from
              v1/ version).

            KEY QUESTIONS:
            1. Are tools.json tool definitions complete? Do they cover
               all gateway operations an agent might need?
            2. Does tool_contract.json declare side effects accurately?
            3. Are the OpenAPI specs valid and parseable? Do they match
               the actual gateway endpoints?
            4. Is there duplication between root openapi.json and
               v1/openapi.json? Which is canonical?
            5. Are request/response schemas accurate for: storage
               provisioning, file CRUD, verification, memory operations,
               operator delegation?
            6. Are there operations in the gateway that have NO spec
               coverage here? (e.g., new endpoints added to gateway
               but not reflected in docs site specs)

            Ground every answer in the actual spec contents.
          key_files:
            - v1/tools.json
            - v1/tool_contract.json
            - v1/openapi.json
            - v1/openapi.yaml
            - v1/openapi_file_management.yaml
            - openapi.json

        agent_guides_expert:
          repo_path: /Users/zhanson/nukez-docs
          model: grok-4-1-fast-reasoning
          provider: xai
          description: >
            Expert on agent-facing documentation guides. Uses reasoning
            to assess whether an autonomous agent could successfully
            complete Nukez storage operations using only these guides.
          system_prompt: >
            You are the expert on the agent-facing documentation at
            docs.nukez.xyz — the markdown guides that teach autonomous
            agents how to use Nukez storage.

            Your domain:
            - docs/AGENT_BRIEFING.md — The "start here" document. An
              agent reading this should understand what Nukez is, what
              it can do, and how to begin.
            - docs/AGENT_FLOW.md — End-to-end walkthrough of the
              storage lifecycle: provision → store → retrieve → verify.
            - docs/AUTH_SIGNED_ENVELOPE.md — Ed25519 signed envelope
              authentication protocol.
            - docs/AUTH_CAP_TOKEN.md — Capability token authentication.
            - docs/ERROR_RECOVERY.md — Failure handling patterns and
              retry strategies.
            - docs/TRUST_BOUNDARY_STATUS.md — Trust model and security
              boundary documentation.
            - docs/AGENT_DOCS_AUDIT.md — A prior audit of doc quality.
            - docs/PHASE_1_MANUAL_TEST_GUIDE.md — Manual testing guide.
            - docs/CHANGELOG.md — Version history.

            KEY QUESTIONS — apply your reasoning to each:
            1. If an LLM reads AGENT_BRIEFING.md, does it have enough
               context to make its first API call? What's missing?
            2. Does AGENT_FLOW.md cover the COMPLETE lifecycle including
               edge cases (payment failure, signing required, operator
               delegation, batch operations)?
            3. Are the auth guides (signed envelope + cap token) clear
               enough for an agent to construct valid auth headers
               without external help?
            4. Does ERROR_RECOVERY.md cover all failure modes an agent
               will actually encounter? Are recovery strategies actionable?
            5. What agent-native guides are MISSING entirely? Consider:
               - Memory operations guide (store_memory, recall_memory)
               - Operator delegation walkthrough
               - Multi-chain payment guide (SOL vs EVM)
               - Verification and attestation guide
               - MCP integration guide (for MCP hosts)
               - Rate limiting and quota guide
            6. Are the existing docs stale relative to the current
               gateway API? (Check against what api_spec_expert finds)
            7. Does the docs site acknowledge the NukezAgent's existence?
               Should there be a guide for using NukezAgent vs raw API?

            Think step-by-step about what an agent would need at each
            stage of its interaction with Nukez.
          key_files:
            - docs/AGENT_BRIEFING.md
            - docs/AGENT_FLOW.md
            - docs/AUTH_SIGNED_ENVELOPE.md
            - docs/AUTH_CAP_TOKEN.md
            - docs/ERROR_RECOVERY.md
            - docs/TRUST_BOUNDARY_STATUS.md
            - docs/AGENT_DOCS_AUDIT.md
            - docs/PHASE_1_MANUAL_TEST_GUIDE.md
            - docs/CHANGELOG.md

        gateway_source:
          repo_path: /Users/zhanson/Desktop/Nukez
          model: gpt-5.4
          provider: openai
          description: >
            READ-ONLY expert on the Nukez gateway source code. Used to
            validate that docs site content matches the actual gateway
            implementation. Not producing docs — only answering sync
            questions.
          system_prompt: >
            You are the expert on the Nukez gateway (api.nukez.xyz) —
            the source of truth that docs.nukez.xyz documents.

            Your role is VALIDATION ONLY. When asked "does the docs
            site's OpenAPI spec match the actual routes?", you check
            the gateway source and report discrepancies.

            KEY VALIDATION AREAS:
            1. Route handlers (gateway/app/routes/) — Do the docs site's
               OpenAPI specs cover all current endpoints?
            2. Request/response schemas (gateway/app/schemas.py) — Do
               the docs site's tool definitions match actual schemas?
            3. Auth requirements — Do the agent guides accurately
               describe the signing and auth flow?
            4. New features — Are there gateway features (routes, tools,
               capabilities) that exist in code but have NO coverage
               in the docs site?
            5. Deprecated features — Are there docs site references to
               endpoints or behaviors that no longer exist in the gateway?
            6. Agent knowledge base (gateway/app/routes/agent_knowledge/)
               — The gateway has its own agent knowledge documents. How
               do they relate to the docs site's agent guides? Is there
               duplication or divergence?

            Answer with specific file paths and line numbers from the
            gateway source.
          key_files:
            - gateway/app/routes/__init__.py
            - gateway/app/routes/storage.py
            - gateway/app/routes/storage_request.py
            - gateway/app/routes/storage_confirm.py
            - gateway/app/routes/files.py
            - gateway/app/routes/retrieve.py
            - gateway/app/routes/receipts.py
            - gateway/app/routes/attest.py
            - gateway/app/routes/wallets.py
            - gateway/app/routes/operators.py
            - gateway/app/routes/lockers_v1.py
            - gateway/app/routes/well_known.py
            - gateway/app/routes/agent.py
            - gateway/app/routes/agent_knowledge/
            - gateway/app/schemas.py
            - gateway/app/main.py
            - gateway/app/core/signed_requests.py
            - gateway/app/core/sigverify.py
            - gateway/app/core/settings.py
            - README.md

disable_files_agent: true
