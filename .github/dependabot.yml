# Dependabot: keep the runtime (pip), base image and workflow actions
# patched. Added 2026-10-22 (eMudhra/emSign CA incident remediation).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
